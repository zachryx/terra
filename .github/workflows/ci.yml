name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: terra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d terra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://user:password@localhost:5432/terra
      JWT_SECRET: ci-jwt-secret
      TICKET_SIGNING_SECRET: ci-ticket-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint:check
      - name: Build
        run: npm run build
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Schema matches migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
